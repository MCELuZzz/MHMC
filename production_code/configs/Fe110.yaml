# Fe(110) / NH3 synthesis system configuration
# Adsorbates are assumed appended after slab atoms.
# Edit system.initial_dataset, system.mlp_model and system.device for your machine.

system:
  name: Fe110_NH3
  slab_file: "<PATH_TO_YOUR_SLAB.extxyz>"
  initial_dataset: "<PATH_TO_YOUR_INITIAL_STRUCTURES.extxyz>"
  mlp_model: "<PATH_TO_YOUR_COMPILED_NEQUIP_MODEL.pt2>"
  device: cuda
topology:
  slab_n_atoms: 32
  z_ceiling_offset: 3.0
  z_floor_offset: -0.5
  z_confine_k: 50.0
basin:
  eps_E: 0.05
  eps_R: 0.4
escape:
  T_init: 600.0
  md_steps: 100
  md_timestep_fs: 1.0
  relax_fmax: 0.05
  relax_steps: 200
walk:
  T_walk: 300.0
  n_walk_steps: 80
  walk_sigma: 0.25
  dE_basin: 0.5
chain:
  E_diff_init: 0.5
  E_diff_min: 0.1
  E_diff_max: 2.0
  chain_window: 10
  chain_acc_target: 0.5
  chain_adapt_rate: 0.1
  reject_T_factor: 1.2
feedback:
  lambda_: 2.0
  rho_star: 0.3
  R_star: 0.5
  gamma_rho: 1.0
  gamma_R: 0.5
  T_min: 700.0
  T_max: 1000.0
dataset:
  md_stride: 10
  relax_stride: 5
  walk_rejected_keep_ratio: 0.3
  dataset_flush_every: 200
loop:
  n_iters: 20
  mode: coupled
  checkpoint_every: 50
output:
  log_path: outputs/Fe110_coupled.jsonl
  checkpoint_path: outputs/Fe110_coupled_state.pkl
  dataset_extxyz_path: outputs/candidate_pool.extxyz
  dataset_index_path: outputs/candidate_pool_index.jsonl
reproducibility:
  seed: 42
hookean:
  enabled: false
  bond_pairs:
  - - 32
    - 33
    - 1.1
  k: 10.0
  beta: 1.5
